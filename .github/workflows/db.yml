name: Base de datos

# Regenera db.json.zip con los últimos cores de sources.ini.
# Se ejecuta al cambiar sources.ini, cada 6 horas (para recoger los cores
# nuevos que se publiquen en sus repositorios) y a mano.

on:
  push:
    branches: [main]
    paths:
      - sources.ini
      - linux.json
      - system.json
      - tools/build_db.py
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [core_released]

permissions:
  contents: write

concurrency:
  group: db
  cancel-in-progress: false

jobs:
  db:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Generar db.json.zip
        run: python3 tools/build_db.py --db-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/db.json.zip"

      - name: Commit
        run: |
          git config user.name "Shaeon (Carlos Palmero)"
          git config user.email "shaeon@users.noreply.github.com"
          git add db.json.zip
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "db.json.zip $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi
