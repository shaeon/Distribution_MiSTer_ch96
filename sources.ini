; Cores para la Chameleon96
;
; Cada sección es un core. build_db.py busca en <repo> (rama <branch>) el
; .rbf más reciente de releases/ para la ch96 y lo publica en <folder>/
; quitando el "_ch96" del nombre, como en MiSTer. Vale el formato actual de
; teiram (_ch96 detrás de la fecha) y el antiguo (_ch96 delante):
;
;   releases/ao486_20261120_ch96.rbf   ->  _Computer/ao486_20261120.rbf
;   releases/TS2068_ch96_20261117.rbf  ->  _Computer/TS2068_20261117.rbf
;
; Los .rbf sin _ch96 de releases/ son los de la DE10 y se ignoran.
;
; Campos:
;   repo     usuario/repositorio de GitHub (obligatorio)
;   branch   rama (por defecto, la principal del repositorio)
;   folder   carpeta de la SD: _Computer, _Console, _Other, _Utility,
;            _Arcade/cores... (por defecto _Computer; _Arcade/cores en los
;            arcades)
;   pattern  patrones de los .rbf dentro de releases/ separados por espacios
;            (por defecto "<sección>_*_ch96.rbf <sección>_ch96_*.rbf")
;   target   ruta fija en la SD (solo para menu.rbf)
;   oficial  ficheros de apoyo (ROMs de arranque, discos vacíos...) que se
;            copian de la distribución oficial de MiSTer, uno por línea;
;            admite comodines: games/AO486/*
;   tags     etiquetas extra para los filtros del Downloader, separadas por
;            espacios. Las normales (cores, computer/arcade..., nombre del
;            core, essential, scripts) las pone build_db.py solo.
;   ficheros ficheros sueltos del repositorio, uno por línea, "origen -> destino"
;            (p. ej. scripts). Una sección con "ficheros" y sin "pattern" no
;            busca ningún .rbf.
;   mra      .mra de releases/ que se copian a _Arcade/, separados por
;            espacios (por defecto *.mra en los arcades, ninguno en el resto)
;
; Arcades: si la sección empieza por "Arcade-" (el nombre del repositorio),
; el .rbf va a _Arcade/cores/ sin el "Arcade-" (como en la distribución
; oficial, que es lo que buscan los .mra) y sus .mra a _Arcade/:
;
;   releases/Arcade-Galaga_20261120_ch96.rbf  ->  _Arcade/cores/Galaga_20261120.rbf
;   releases/Galaga (Midway, Set 1).mra       ->  _Arcade/Galaga (Midway, Set 1).mra
;
; Las ROMs (games/mame/*.zip) no se distribuyen: las pone cada uno.
;
; Para añadir un core nuevo basta con añadir su sección y hacer push: el
; workflow regenera db.json.zip.

; Ficheros que se copian tal cual de la distribución oficial de MiSTer: los
; scripts que no dependen de la placa (WiFi, Samba, zona horaria...).
; update.sh es el lanzador del Downloader.
[oficial]
files = Scripts/update.sh
        Scripts/wifi.sh
        Scripts/samba_on.sh
        Scripts/timezone.sh
        Scripts/ini_settings.sh
        Scripts/fast_USB_polling_on.sh
        Scripts/fast_USB_polling_off.sh

; Scripts de MidiLink (MT-32 con MUNT y General MIDI con FluidSynth en el ao486):
; soundfont_install baja las soundfonts y las ROMs del MT-32 a linux/soundfonts y
; linux/mt32-rom-data; midilink_updater actualiza midilink y mlinkutil.
[MidiLink]
repo     = MiSTer-devel/MidiLink_MiSTer
ficheros = INSTALL/soundfont_install.sh -> Scripts/soundfont_install.sh
           INSTALL/midilink_updater.sh -> Scripts/midilink_updater.sh

; Scripts propios de la ch96 (ch96/Scripts/ de este repositorio).
; update_extras: BIOS y ROMs de arcade solo para los cores instalados, con las
; mismas bases de datos que update_all (bios_db y arcade_roms_db) pero sin
; update_all, que instalaría la distribución de la DE10.
[ch96-scripts]
repo     = shaeon/Distribution_MiSTer_ch96
ficheros = ch96/Scripts/update_extras.sh -> Scripts/update_extras.sh

[menu]
repo    = teiram/Menu_MiSTer_ch96
target  = menu.rbf

; --- Cores de teiram (Manuel Teira) ---

[ao486]
repo    = teiram/ao486_MiSTer_ch96
oficial = games/AO486/*

[Amstrad]
repo    = teiram/Amstrad_MiSTer_ch96
oficial = games/Amstrad/*

[Amstrad-PCW]
repo    = teiram/Amstrad-PCW_MiSTer_ch96
oficial = games/Amstrad PCW/*

[BBCMicro]
repo    = teiram/BBCMicro_MiSTer_ch96

[MicroBee]
repo    = teiram/MicroBee_MiSTer_ch96

[PET2001]
repo    = teiram/PET2001_MiSTer_ch96
oficial = games/PET2001/*

[SharpMZ]
repo    = teiram/SharpMZ_MiSTer_ch96

[Microtan65]
repo    = teiram/Microtan65_ch96

[TI-99_4A]
repo    = teiram/TI-99_4A_MiSTer_ch96
pattern = Ti994a_*_ch96.rbf
oficial = games/TI-99_4A/*

