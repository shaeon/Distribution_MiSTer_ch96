; Cores para la Chameleon96
;
; Cada sección es un core. build_db.py busca en <repo> (rama <branch>) el
; último fichero de releases/ que cumpla <pattern> (por defecto
; <sección>_ch96_*.rbf, con la fecha AAAAMMDD al final) y lo publica en
; <folder>/ quitando el "_ch96" del nombre, como en MiSTer:
;
;   releases/TS2068_ch96_20261117.rbf  ->  _Computer/TS2068_20261117.rbf
;
; Campos:
;   repo     usuario/repositorio de GitHub (obligatorio)
;   branch   rama (por defecto, la principal del repositorio)
;   folder   carpeta de la SD: _Computer, _Console, _Other, _Utility,
;            _Arcade/cores... (por defecto _Computer)
;   pattern  patrón de los .rbf dentro de releases/
;   target   ruta fija en la SD (solo para menu.rbf)
;
; Para añadir un core nuevo basta con añadir su sección y hacer push: el
; workflow regenera db.json.zip.

[menu]
repo    = teiram/Menu_MiSTer_ch96
pattern = menu_ch96_*.rbf
target  = menu.rbf

[TS2068]
repo    = Maverick-Shark/TS2068_MiSTer
branch  = ch96
folder  = _Computer
