; PCXT de Aitor (IBM PC/XT, Tandy 1000 y PCjr). La distribución oficial solo
; trae el .rbf y la documentación, sin BIOS: las BIOS libres vienen de
; SW/ROMs/ de su repositorio. boot0.rom (Micro8088 con XTIDE) es la que
; Main_MiSTer carga sola en la ranura 0 (PCXT BIOS) al arrancar el core si no
; se ha elegido otra en el OSD; las demás se eligen en System & BIOS.
[PCXT]
repo     = aitorgomez-net/PCXT_ch96
pattern  = PCXT_*_ch96.rbf PCXT_ch96_*.rbf
ficheros = SW/ROMs/pcxt_xtsergey.rom -> games/PCXT/boot0.rom
           SW/ROMs/pcxt_xtsergey.rom -> games/PCXT/pcxt_xtsergey.rom
           SW/ROMs/pcxt_pcxt31.rom   -> games/PCXT/pcxt_pcxt31.rom
           SW/ROMs/ide_xtl.rom       -> games/PCXT/ide_xtl.rom
           SW/ROMs/BASICA/pcxt_xtsergey.rom -> games/PCXT/BASICA/pcxt_xtsergey.rom
           SW/ROMs/BASICA/pcxt_pcxt31.rom   -> games/PCXT/BASICA/pcxt_pcxt31.rom
           SW/ROMs/BASICA/ide_xtl.rom       -> games/PCXT/BASICA/ide_xtl.rom
tags     = pcxt

[IMSAI8080]
repo    = shaeon/IMSAI8080_MiSTer
branch  = ch96

[Osborne]
repo    = shaeon/Osborne_MiSTer_ch96

[Lynx]
repo    = shaeon/Lynx_MiSTer_ch96

[TatungEinstein]
repo    = shaeon/TatungEinstein_ch96

; MEGA65: arranca con las OpenROMs que lleva dentro; la SD (games/MEGA65/boot.vhd)
; y MEGA65.ROM los pone cada uno, como en MiSTer.
[MEGA65]
repo    = shaeon/MEGA65_MiSTer_ch96
